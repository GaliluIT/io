- date: 2016-10
  title: Foro Internacional Metabody
  title_en: Metabody International Forum
  place: Buenos Aires y Montevideo
  place_en: Buenos Aires and Montevideo
  text: "Trabajamos en el laboratorio con el filósofo, artista e investigador Jaime del Val, del proyecto Metabody, en las jornadas «Metaterapias: cuerpos expandidos, espacios dinámicos y ecologías plurales», con conferencias, talleres y performances a ambas orillas del Río de la Plata. Exploramos cómo llevar los entornos interactivos de Metabody a contextos de aprendizaje de adolescentes con diversidad funcional, usando el movimiento, el contacto físico y el entorno dinámico como lenguaje inclusivo. Con el apoyo de la Cooperación Española, la Embajada de España, la AECID y la UNTREF."
  text_en: "We worked in the lab with the Spanish philosopher, artist and researcher Jaime del Val of the Metabody project, during the “Metatherapies: expanded bodies, dynamic spaces and plural ecologies” days, with talks, workshops and performances on both sides of the Río de la Plata. We explored how Metabody's interactive environments could support learning for disabled teenagers, using movement, touch and a dynamic environment as an inclusive language. Supported by Spanish Cooperation, the Embassy of Spain, AECID and UNTREF."
  images:
    - src: assets/intercambios/act-2016-metabody/01.jpg
      caption: Metabody.

