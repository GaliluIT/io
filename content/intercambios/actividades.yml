- date: 2023-01
  title: Beca doctoral en Virginia Tech
  title_en: Doctoral fellowship at Virginia Tech
  place: Virginia Tech, EE. UU.
  place_en: Virginia Tech, USA
  text: A partir de los vínculos iniciados en 2021 entre el MUNTREF Centro de Arte y Ciencia y el Instituto para la Creatividad, el Arte y la Tecnología (ICAT) de Virginia Tech, Gala Lucia Gonzalez Barrios fue aceptada en el doctorado de esa universidad con una beca completa, para continuar su investigación sobre la voz humana, nuevas formas de generar voz y el enfoque social en salud. El programa comenzó en agosto de 2023.
  text_en: Building on ties begun in 2021 between MUNTREF Centro de Arte y Ciencia and Virginia Tech's Institute for Creativity, Arts, and Technology (ICAT), Gala Lucia Gonzalez Barrios was admitted to the university's doctoral program with full funding, to continue her research on the human voice, new ways of producing voice and a social approach to health. The program began in August 2023.

- date: 2023-02
  title: Fonocosa Aldo y Fonocosa Furinge
  title_en: Fonocosa Aldo and Fonocosa Furinge
  text: Dos obras nuevas de la serie Fonocosa. Aldo es una escultura impresa en 3D a partir de deformaciones de la laringe, con una pieza sonora; Furinge es un díptico de pieza gráfica y video.
  text_en: Two new works in the Fonocosa series. Aldo is a 3D-printed sculpture based on deformations of the larynx, with a sound piece; Furinge is a diptych of a graphic piece and a video.
  project: fonocosa-aldo

- date: 2023-08
  title: Archivoz en Sinergias
  title_en: Archivoz at Sinergias
  place: CCK, Buenos Aires
  text: Presentamos Archivoz en Sinergias, un encuentro organizado por la SEPyME de la Provincia de Buenos Aires para conectar empresas de la Cámara de Comercio de los Estados Unidos en Argentina (AmCham) con proyectos nacionales de desarrollo tecnológico en salud. Fue también el debut de Mauro Módica y Matías Di Bernardo presentando el proyecto.
  text_en: We presented Archivoz at Sinergias, an event organized by the Buenos Aires Province small-business secretariat to connect companies from the American Chamber of Commerce in Argentina (AmCham) with Argentine health technology projects. It was also the first pitch by our teammates Mauro Módica and Matías Di Bernardo.
  project: archivoz

