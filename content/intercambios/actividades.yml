- date: 2020-05
  title: "Conversatorio: Cuerpos, máquinas, datos, cosas"
  title_en: "Conversation: Bodies, machines, data, things"
  place: En línea
  place_en: Online
  text: Un conversatorio en línea moderado por IT y Darío Sandrone, con estudiantes de Artes Electrónicas y Psicomotricidad, entre otros de todo el país, sobre las relaciones entre los cuerpos, los objetos y las tecnologías.
