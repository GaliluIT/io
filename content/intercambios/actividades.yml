- date: 2015-11
  title: Encuentro con alumnos del IES Juan Ramón Fernández (Lenguas Vivas)
  title_en: Visit by students from IES Juan Ramón Fernández (Lenguas Vivas)
  place: MUNTREF Arte y Ciencia
  text: Ofrecimos un recorrido interactivo para alumnos de sexto grado de la escuela Lenguas Vivas. Participaron en distintos grupos de investigación, entraron en contacto con nuestras interfaces y pusieron en juego su iniciativa y su creatividad.
  text_en: We gave sixth-grade students from the Lenguas Vivas school an interactive tour. They joined different research groups, tried our interfaces and brought their own initiative and creativity into play.
  links:
    - label: Video (Vimeo)
      url: https://vimeo.com/164581080

