- date: 2022-11
  title: Primera Jornada de Jóvenes Investigadores
  title_en: First Young Researchers' Day
  place: Departamento de Arte y Cultura, UNTREF
  place_en: Department of Art and Culture, UNTREF
  text: El 10 de noviembre celebramos la primera Jornada de Jóvenes Investigadores del Departamento de Arte y Cultura de la UNTREF, organizada por Gala Lucia Gonzalez Barrios a pedido de la dirección del departamento. En la Argentina es difícil encontrar un lugar en el sistema científico-tecnológico para investigar en la intersección entre arte, ciencia y tecnología, y este espacio reunió las investigaciones de creación que empiezan los alumnxs de grado del departamento, acompañados por sus docentes y coordinadores.
  text_en: On November 10 we held the first Young Researchers' Day of UNTREF's Department of Art and Culture, organized by Gala Lucia Gonzalez Barrios at the department's request. In Argentina it is hard to find a place in the science and technology system for research at the intersection of art, science and technology, and the day brought together the creative research projects that undergraduates in the department are starting, with the faculty who support them.

