- date: 2016-07
  title: Muestra «Intercambios Transorgánicos» en MUNTREF Tecnópolis
  title_en: “Intercambios Transorgánicos” exhibition at MUNTREF Tecnópolis
  place: Tecnópolis, Buenos Aires
  text: El MUNTREF reabrió su sede Arte y Ciencia con una muestra sobre las interfaces y los dispositivos electrónicos que desarrollamos para la salud y la educación, abierta hasta el 10 de octubre. El público conoció nuestros dispositivos, participó de las actividades del laboratorio y dejó su testimonio en una pizarra gigante.
  text_en: MUNTREF reopened its art and science venue with an exhibition of the interfaces and electronic devices we develop for health and education, open until October 10. Visitors tried our devices, took part in lab activities and left their comments on a giant whiteboard.
  links:
    - label: Ver video
      label_en: Watch the video
      url: https://www.youtube.com/watch?v=wIiX5inPCd4
  images:
    - src: assets/intercambios/act-2016-tecnopolis/01.jpg
      caption: MUNTREF Arte y Ciencia en Tecnópolis.
      caption_en: MUNTREF Arte y Ciencia at Tecnópolis.

- date: 2016-07
  title: Taller por el Día del Niño
  title_en: Children's Day workshop
  place: Tecnópolis, Buenos Aires
  text: Por el Día del Niño, en el marco de la muestra, abrimos el laboratorio a los más chicos con una charla sobre electrónica básica y diseñamos juntos varios accesorios wearables.
  text_en: For Children's Day, during the exhibition, we opened the lab to kids with an introduction to basic electronics and designed several wearable accessories together.
  links:
    - label: Ver video
