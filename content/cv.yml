# Your CV, section by section, in the order they appear.
# Each item:
#   when:  dates as you want them shown, e.g. 2021 – 2027 or Expected 2027
#   what:  the main line (bold)
#   where: optional second line
#   note:  optional smaller line
#   check: optional note to yourself, shown only with `python build.py --drafts`
# A section with "from: publications" lists everything in publications.yml,
# and one with "from: press" everything in press.yml.
# Markdown works in what/where/note, e.g. [link text](https://...).
#
# The order and wording follow the CVs for the NYU and Cornell applications
# (November 2026). Each thing appears once: a talk that is also a paper is
# listed under Publications only, an award under Awards only, and so on.

