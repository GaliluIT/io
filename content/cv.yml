- title: Research and creative projects
  items:
    - when: 2025 – present
      what: "[Singing Machine](projects/singing-machine.html), lead researcher"
      note: Browser-based vocal instrument that lets people who have lost their larynx sing through mouth and hand movements captured by an ordinary webcam. Technical collaboration with Dr. Ivica Bukvic (Indiana University).
    - when: Ongoing
      what: "[Archivoz](projects/archivoz.html), director"
      note: Community-governed voice corpus and speech infrastructure responding to data extraction in speech synthesis. INARIA National AI Award, 2025.
    - when: 2026 – 2027
      what: "[Returning Sound](projects/returning-sound.html), collaborator"
      note: With Shout at Cancer (UK), the Education University of Hong Kong and ICAT (Virginia Tech); premiere at the Hong Kong Academy for Performing Arts, March 2027.
    - when: "2024"
      what: "[Shore Thing](projects/shore-thing.html), co-creator"
      note: Board game on sea level rise and shorelines for classrooms; 2024 a2RU Emerging Creatives Challenge Grant, with Abby Tuckett (RISD); A2RU Annual Conference, Rochester Institute of Technology.
    - when: 2019 – present
      what: "[Fonocosa](projects/fonocosa.html), including Fonocosa Aldo and Fonocosa Furinge (2023)"
    - when: 2017 – 2019
      what: "C3D, lead designer"
      note: Digital-art tool for physical therapy focused on motivation and identity restoration; national awards in 2017 and 2018.

