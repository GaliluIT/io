- title: Research and creative projects
  items:
    - when: 2025 – present
      what: "[Singing Machine](projects/singing-machine.html), lead researcher"
      note: Browser-based vocal instrument that lets people who have lost their larynx sing through mouth and hand movements captured by an ordinary webcam. Technical collaboration with Dr. Ivica Bukvic (Indiana University).
    - when: 2019 – present
      what: "[Archivoz](projects/archivoz.html), director"
      note: Community-governed voice corpus and speech infrastructure responding to data extraction in speech synthesis.
    - when: 2026 – 2027
      what: "[Returning Sound](projects/returning-sound.html), collaborator"
      note: With Shout at Cancer (UK), Hong Kong Baptist University and ICAT (Virginia Tech); premiere at the Hong Kong Academy for Performing Arts, March 2027; adaptation for the Cube (ICAT, Virginia Tech) with Uhura Bionics (Poland), planned for September 2027.
    - when: "2024"
      what: "[Shore Thing](projects/shore-thing.html), co-creator"
      note: Board game on sea level rise and shorelines for classrooms; 2024 a2RU Emerging Creatives Challenge Grant, with Abby Tuckett (RISD); A2RU Annual Conference, Rochester Institute of Technology.
    - when: 2019 – present
      what: "[Fonocosa](projects/fonocosa.html), director"
      note: An assistive speech interface for people who have had a laryngectomy that grew into research on the voice as a marker of identity, and into a series of works, including Fonocosa Aldo and Fonocosa Furinge (2023).
    - when: 2017 – 2019
      what: "[C3D](projects/c3d.html), lead designer"
      note: Digital-art tool for physical therapy focused on motivation and identity restoration.

